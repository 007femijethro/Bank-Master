name: CI

on:
  push:
    branches: [main, v2-refinement]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bank_master_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bank_master_test
      SESSION_SECRET: ci-session-secret-that-is-long-and-random-enough
      DATA_ENCRYPTION_KEY: ci-encryption-key-that-is-long-and-separate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run db:push
      - run: npm run test:integration
      - run: npm run build
      - run: docker build -t bank-master:${{ github.sha }} .
